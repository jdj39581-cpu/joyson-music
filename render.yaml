services:
  - type: web
    name: joyson-music
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPOTIFY_CLIENT_ID
        value: 83259f32ab8246e5b33fd0b0789437b2
      - key: SPOTIFY_REDIRECT_URI
        value: https://joyson-music.onrender.com/api/spotify/callback
